[project]
name = "soulmates"
version = "0.1.0"
description = "Bayesian odds of finding your soul mate, for a PyCon talk"
requires-python = ">=3.13"
dependencies = [
    "arviz>=1.3",
    "marimo>=0.25.2",
    "matplotlib>=3.11",
    "pandas>=3.1",
    "preliz>=0.28",
    "pymc>=6.4",
    "pytensor>=3.3.7",
]

[dependency-groups]
dev = ["ipykernel", "nbconvert", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
